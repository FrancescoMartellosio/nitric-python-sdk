repos:
  - repo: https://github.com/ambv/black
    rev: stable
    hooks:
      - id: black
        # Added the generated folder here
        exclude: ^(nitric/proto|nitric/resources/dsl/generated)/
  - repo: https://github.com/pycqa/flake8
    rev: 3.7.9
    hooks:
      - id: flake8
        # Added the generated folder here
        exclude: ^(venv|tests|build|dist|nitric/proto|nitric/resources/dsl/generated)/
  - repo: https://github.com/pycqa/pydocstyle
    rev: 6.0.0
    hooks:
      - id: pydocstyle
        args:
          - --ignore=D100, D105, D203, D212, D415
        # Added the generated folder here
        exclude: ^(venv|tests|build|dist|nitric/proto|nitric/resources/dsl/generated)/